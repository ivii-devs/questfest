name: QuestFest CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-lint-and-build:
    name: Frontend (Next.js 16) Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del cliente
        run: |
          cd frontend
          npm ci || npm install

      - name: Validar Linting de TypeScript y Next.js
        run: |
          cd frontend
          npm run lint

      - name: Compilar Build de Produccion
        run: |
          cd frontend
          npm run build

  backend-test-and-lint:
    name: Backend (FastAPI) Test & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del servidor
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Suite de Tests Automatizados (Pytest)
        run: |
          cd backend
          pytest tests/ -v --durations=10
