events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Compresion Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/event-stream;

    # Cabeceras de Seguridad HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server {
        listen 80;
        server_name _;

        # Certbot challenge para SSL
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redireccion automatica a HTTPS en produccion
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/questfest.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/questfest.app/privkey.pem;

        # Proxy inverso para la API Backend (FastAPI)
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Configuracion especial para Server-Sent Events (SSE) / Real-Time
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # Proxy inverso para la Aplicacion Web Frontend (Next.js)
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
