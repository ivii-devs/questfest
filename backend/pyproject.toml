[project]
name = "questfest-api"
version = "0.1.0"
description = "QuestFest Backend API y Motor Transaccional"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "python-dotenv>=1.0.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0.1",
    "cloudinary>=1.40.0",
    "slowapi>=0.1.9",
    "redis>=5.0.3",
    "pywebpush>=1.14.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Declaramos a UV que QuestFest es una aplicación ejecutable y no una librería para empaquetar
[tool.uv]
package = false

# Delimitamos el autodescubrimiento de setuptools exclusivamente a la carpeta 'app'
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "venv",
    ".venv",
    "alembic",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E501",  # Longitud de línea gestionada por el formateador
    "B008",  # Idioma estándar de FastAPI para inyección de dependencias con Depends()
    "B904",  # Re-lanzamiento intencional sin encadenamiento redundante
]

[tool.ruff.lint.per-file-ignores]
"app/models/*" = ["F821"]  # Referencias adelantadas en cadenas de SQLAlchemy Mapped["Model"]
"app/security.py" = ["E402"]  # Intercepción y parche de compatibilidad bcrypt previa a passlib

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
