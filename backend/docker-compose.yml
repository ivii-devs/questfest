services:
  # 1. Contenedor de la Base de Datos
  db:
    image: postgres:15-alpine
    container_name: questfest_postgres
    restart: 'no'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Contenedor del Backend (FastAPI)
  web:
    build: .
    container_name: questfest_web
    restart: always
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
