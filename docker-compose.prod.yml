version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: questfest_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-questfest_prod}
      POSTGRES_USER: ${POSTGRES_USER:-questfest_admin}
      # Requerimos obligatoriamente que se defina una contraseña en el entorno para evitar credenciales por defecto públicas
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Debes definir POSTGRES_PASSWORD en el archivo .env de produccion}"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-questfest_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: questfest_redis_prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: questfest_api_prod
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-questfest_admin}:${POSTGRES_PASSWORD:?Debes definir POSTGRES_PASSWORD en el archivo .env de produccion}@postgres:5432/${POSTGRES_DB:-questfest_prod}"
      REDIS_URL: redis://redis:6379/0
      # Clave secreta estricta obligatoria para firmar JWT de producción de forma segura
      SECRET_KEY: "${SECRET_KEY:?Debes definir SECRET_KEY en el archivo .env de produccion}"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://questfest.app}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://questfest.app}
    container_name: questfest_web_prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://questfest.app}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: questfest_proxy_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data:
